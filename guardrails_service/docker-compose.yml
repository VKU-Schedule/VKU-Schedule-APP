version: '3.8'

services:
  guardrails:
    build: .
    container_name: vku-guardrails
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=8002
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - VKU_SmartScheduler-network

networks:
  VKU_SmartScheduler-network:
    external: true
